# Despliegue de Podio en Render (Blueprint): un solo servicio web que sirve la API,
# Socket.IO y la app React compilada, en la misma URL.
# La base de datos MySQL está en Aiven (ver docs/06-despliegue/despliegue-render-aiven.md).
services:
  - type: web
    name: podio
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev --prefix server && npm ci --include=dev --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # Datos de conexión de Aiven: se completan en el panel de Render al crear el Blueprint
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_CA
        sync: false
      - key: DB_NAME
        value: torneos_db
      - key: DB_SSL
        value: "true"
