<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900">
<title>Wireframe 06 — Inscripción a una prueba (Sprint 2)</title>
<rect id="fondo" width="1440" height="900" fill="#f4f6f9"/>
<g id="barra-de-navegacion"><rect x="0" y="0" width="1440" height="64" rx="0" fill="#ffffff" stroke="#c9d2de" stroke-width="1"/><g id="logo"><rect x="64" y="16" width="32" height="32" rx="8" fill="#0b2545" stroke="none" stroke-width="1"/><rect x="70" y="31" width="6" height="10" rx="1" fill="#22b8cf" stroke="none" stroke-width="1"/><rect x="77" y="25" width="6" height="16" rx="1" fill="#fff" stroke="none" stroke-width="1"/><rect x="84" y="34" width="6" height="7" rx="1" fill="#f97316" stroke="none" stroke-width="1"/><text x="106" y="40" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#1b2633" text-anchor="start">Podio</text></g><text x="210" y="38" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1b2633" text-anchor="start">Inicio</text><text x="320" y="38" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#0c6b80" text-anchor="start">Torneos</text><text x="430" y="38" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1b2633" text-anchor="start">Cómo funciona</text><text x="1180" y="32" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#1b2633" text-anchor="end">Valentina Rojas</text><text x="1180" y="48" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5b6878" text-anchor="end">Atleta</text><g id="boton-salir"><rect x="1200" y="10" width="90" height="44" rx="10" fill="none" stroke="none" stroke-width="1"/><text x="1245" y="37" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1b2633" text-anchor="middle">Salir</text></g><rect x="1332" y="10" width="44" height="44" rx="10" fill="#ffffff" stroke="#c9d2de" stroke-width="1"/></g>
<g id="pasos"><g id="paso-1-prueba"><circle cx="400" cy="130" r="18" fill="#0c6b80"/><text x="400" y="170" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#1b2633" text-anchor="middle">Prueba</text><line x1="422" y1="130" x2="698" y2="130" stroke="#0c6b80" stroke-width="3"/></g><g id="paso-2-confirmar-datos"><circle cx="720" cy="130" r="18" fill="#0c6b80"/><text x="720" y="170" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#1b2633" text-anchor="middle">Confirmar datos</text><line x1="742" y1="130" x2="1018" y2="130" stroke="#c9d2de" stroke-width="3"/></g><g id="paso-3-listo"><circle cx="1040" cy="130" r="18" fill="#e7ecf2"/><text x="1040" y="170" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="#5b6878" text-anchor="middle">Listo</text></g></g>
<g id="resumen-inscripcion"><rect x="320" y="210" width="800" height="540" rx="16" fill="#ffffff" stroke="#c9d2de" stroke-width="1"/><text x="360" y="262" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="30" font-weight="800" fill="#1b2633" text-anchor="start">Confirma tu inscripción</text><g id="dato-torneo"><text x="360" y="320" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#5b6878" text-anchor="start">Torneo</text><text x="360" y="346" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1b2633" text-anchor="start">Copa Aguas Abiertas Lago Azul 2026</text></g><g id="dato-prueba"><text x="360" y="390" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#5b6878" text-anchor="start">Prueba</text><text x="360" y="416" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1b2633" text-anchor="start">Aguas abiertas 1.500 m · sáb 12 dic · 08:00</text></g><g id="dato-categoria-asignada"><text x="360" y="460" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#5b6878" text-anchor="start">Categoría asignada</text><text x="360" y="486" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1b2633" text-anchor="start">Juvenil Femenino (18 años)</text></g><g id="dato-atleta"><text x="360" y="530" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#5b6878" text-anchor="start">Atleta</text><text x="360" y="556" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="600" fill="#1b2633" text-anchor="start">Valentina Rojas · Club Delfines</text></g><g id="nota-de-diseno"><rect x="360" y="600" width="720" height="30" rx="6" fill="#fff7e0" stroke="#e3c56b" stroke-width="1"/><text x="370" y="620" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#6b5200" text-anchor="start">La categoría se calcula con la edad a la fecha del torneo y el sexo del atleta</text></g><g id="boton-volver"><rect x="360" y="664" width="200" height="52" rx="10" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/><text x="460" y="695" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1b2633" text-anchor="middle">Volver</text></g><g id="boton-confirmar"><rect x="880" y="664" width="200" height="52" rx="10" fill="#c2410c" stroke="#c2410c" stroke-width="1"/><text x="980" y="695" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Confirmar</text></g></g>
</svg>
