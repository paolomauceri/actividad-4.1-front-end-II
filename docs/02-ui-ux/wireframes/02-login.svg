<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760">
<title>Wireframe 02 — Iniciar sesión</title>
<rect id="fondo" width="1440" height="760" fill="#f4f6f9"/>
<g id="barra-de-navegacion"><rect x="0" y="0" width="1440" height="64" rx="0" fill="#ffffff" stroke="#c9d2de" stroke-width="1"/><g id="logo"><rect x="64" y="16" width="32" height="32" rx="8" fill="#0b2545" stroke="none" stroke-width="1"/><rect x="70" y="31" width="6" height="10" rx="1" fill="#22b8cf" stroke="none" stroke-width="1"/><rect x="77" y="25" width="6" height="16" rx="1" fill="#fff" stroke="none" stroke-width="1"/><rect x="84" y="34" width="6" height="7" rx="1" fill="#f97316" stroke="none" stroke-width="1"/><text x="106" y="40" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#1b2633" text-anchor="start">Podio</text></g><text x="210" y="38" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1b2633" text-anchor="start">Inicio</text><text x="320" y="38" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1b2633" text-anchor="start">Torneos</text><text x="430" y="38" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="500" fill="#1b2633" text-anchor="start">Cómo funciona</text><g id="boton-iniciar-sesion"><rect x="1040" y="10" width="150" height="44" rx="10" fill="none" stroke="none" stroke-width="1"/><text x="1115" y="37" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#1b2633" text-anchor="middle">Iniciar sesión</text></g><g id="boton-inscribete"><rect x="1200" y="10" width="130" height="44" rx="10" fill="#c2410c" stroke="#c2410c" stroke-width="1"/><text x="1265" y="37" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Inscríbete</text></g><rect x="1342" y="10" width="44" height="44" rx="10" fill="#ffffff" stroke="#c9d2de" stroke-width="1"/></g>
<g id="panel-de-marca"><rect x="64" y="112" width="560" height="360" rx="16" fill="#0b2545" stroke="none" stroke-width="1"/><text x="104" y="170" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="#7fe0ee" text-anchor="start">PODIO</text><text x="104" y="220" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="start">Del registro al podio,</text><text x="104" y="258" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="32" font-weight="800" fill="#fff" text-anchor="start">en un solo lugar.</text><g id="beneficio-1"><rect x="104" y="300" width="22" height="22" rx="5" fill="#fdba74" opacity="0.55"/><rect x="140" y="306" width="320" height="10" rx="5" fill="#3a5576"/></g><g id="beneficio-2"><rect x="104" y="344" width="22" height="22" rx="5" fill="#fdba74" opacity="0.55"/><rect x="140" y="350" width="320" height="10" rx="5" fill="#3a5576"/></g><g id="beneficio-3"><rect x="104" y="388" width="22" height="22" rx="5" fill="#fdba74" opacity="0.55"/><rect x="140" y="394" width="320" height="10" rx="5" fill="#3a5576"/></g></g>
<g id="tarjeta-formulario"><rect x="664" y="112" width="712" height="560" rx="16" fill="#ffffff" stroke="#c9d2de" stroke-width="1"/><text x="704" y="168" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="36" font-weight="800" fill="#1b2633" text-anchor="start">Iniciar sesión</text><text x="704" y="198" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6878" text-anchor="start">Accede para inscribirte, registrar tiempos o administrar torneos.</text><g id="campo-correo-electronico"><text x="704" y="240" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1b2633" text-anchor="start">Correo electrónico *</text><rect x="704" y="248" width="632" height="44" rx="10" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/><text x="716" y="276" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6878" text-anchor="start">nombre@correo.com</text></g><g id="campo-contrasena"><text x="704" y="320" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1b2633" text-anchor="start">Contraseña *</text><rect x="704" y="328" width="632" height="44" rx="10" fill="#ffffff" stroke="#9aa7b8" stroke-width="1"/><text x="716" y="356" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5b6878" text-anchor="start">••••••••</text></g><rect x="1300" y="342" width="20" height="20" rx="5" fill="#9aa7b8" opacity="0.55"/><g id="boton-iniciar-sesion"><rect x="704" y="410" width="632" height="52" rx="10" fill="#0c6b80" stroke="#0c6b80" stroke-width="1"/><text x="1020" y="441" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#fff" text-anchor="middle">Iniciar sesión</text></g><g id="enlace-registro"><line x1="704" y1="500" x2="1336" y2="500" stroke="#c9d2de"/><text x="1020" y="540" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5b6878" text-anchor="middle">¿Aún no tienes cuenta? Inscríbete como atleta</text></g><g id="nota-de-diseno"><rect x="704" y="610" width="632" height="30" rx="6" fill="#fff7e0" stroke="#e3c56b" stroke-width="1"/><text x="714" y="630" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#6b5200" text-anchor="start">Errores junto al campo · foco al primer error · botón con estado de carga</text></g></g>
